name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Must precede setup-nub: the action resolves the Node pin and the lockfile from the checkout.
      - uses: actions/checkout@v4

      # Drop-in for actions/setup-node: installs the nub CLI, provisions Node, caches the store.
      # The exact version lives in `.node-version`; `engines.node` is only a range (`>=26`).
      - uses: nubjs/setup-nub@v0
        with:
          node-version-file: .node-version

      - run: nub install --frozen-lockfile

      - run: nub run lint
      - run: nub run typecheck
      - run: nub run build
      - run: nub run test
