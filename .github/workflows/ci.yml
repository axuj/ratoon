name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # both platforms on purpose: the shell layer and the e2e suites are the parts that
        # differ, and Windows is the one this project is developed on
        os: [ubuntu-latest, windows-latest]
        node: [26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # the pinned packageManager is nub@0.9.7; installing the same version from npm means
      # nub never tries to provision a second copy
      - name: install nub
        run: npm install --global @nubjs/nub

      - name: install dependencies
        run: nub ci

      - name: lint
        run: nub run lint

      - name: typecheck
        run: nub run typecheck

      - name: build
        run: nub run build

      - name: test
        run: nub run test
